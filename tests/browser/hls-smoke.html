<!doctype html><html lang="es-CL"><meta charset="utf-8"><title>VeloNexo · Prueba HLS</title><style>body{background:#101014;color:white;font:16px system-ui;text-align:center}video{height:75vh;max-width:95vw}p{max-width:700px;margin:20px auto}</style><h1>VeloNexo · Prueba de almacenamiento</h1><video controls muted playsinline></video><p id="status">Cargando…</p><script src="/browser/node_modules/hls.js/dist/hls.min.js"></script><script>
const video=document.querySelector('video');window.errors=[];window.providers=[];
if(Hls.isSupported()){const hls=new Hls();window.hls=hls;hls.loadSource('remote.m3u8');hls.attachMedia(video);hls.on(Hls.Events.FRAG_LOADED,(_,d)=>{window.providers.push(new URL(d.frag.url).hostname);document.querySelector('#status').textContent='Fragmentos cargados: '+window.providers.length});hls.on(Hls.Events.ERROR,(_,d)=>{if(d.fatal)window.errors.push(d.details)});hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play().catch(()=>{}))}else if(video.canPlayType('application/vnd.apple.mpegurl')){video.src='remote.m3u8'}else{document.querySelector('#status').textContent='HLS no compatible'}
</script></html>
